<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #calendar{
            width: fit-content;
            height: fit-content;
            position: relative;
            display: inline-block;
        }
        .to-slide-down, .to-slide-up,  #week-tiles-bar-wrapper{
            min-width: 700px;
            height: 100px;
            position: absolute;
            left: 0;
            display: inline-block;
        }
        .to-slide-down{
            top: -100px;
            transition: top .5s;
        }
        .to-slide-up{
            top: 200px;
            transition: top .5s;
        }
        #week-tiles-bar-wrapper{
            top: 50px;
            z-index: 999;
            overflow: hidden;
        }
        .tiles{
            width: 100px;
            height: 100px;
            margin: 0;
            display: inline-block;
            background-color: rgb(223, 227, 219);
            color: rgb(201, 204, 204);
            text-align: center;
            font-size: 15px;
            font-weight: 600;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            
        }
        .sliding-in{
            top: 0;
        }
        .day-active{
            background-color: rgb(188, 240, 137);
            color: rgb(10, 102, 105);
        }
        .day-current{
            color: rgb(55, 206, 211);
        }
        .arrow-heads{
            width: 700px;
            height: 50px;
            position: absolute;
            top: 0;
            left: 0;
            display: block;
            background-color: chartreuse;
            color: cadetblue;
        }
        .arrow-heads:last-child{
            top: 150px;
        }
        .day-active:hover, .arrow-heads:hover{
            opacity: .8;
            cursor: pointer;
        }
        .day-active:active, .arrow-heads:active{
            outline: 2px solid red;
            outline-offset: -2px;
        }
        p.day, .arrow-head-char{
            margin: 0;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        p.day-name{
            font-size: 16px;
        }
        p.day-number{
            font-size: 30px;
        }
        p.day-month{
            font-size: 16px;
        }
        p.day-year{
            font-size: 14px;
        }
    </style>
</head>
<body>
    <main>
    <div id="calendar">
        <div id="arrowHeadLeft" class="tiles arrow-heads"><p class="arrow-head-char">&uArr;<br/>PREVIOUS WEEK</p></div>
            <div id="week-tiles-bar-wrapper">
                <div id="week-tiles-bar-static"></div>
            </div>
        <div id="arrowHeadRight" class="tiles arrow-heads"><p class="arrow-head-char">NEXT WEEK<br/>&dArr;</p></div>
    </div>
    </main>

    <script>
        
        let weekNumberFromNow = 0;
        
        const WEEK_TILES_BAR_WRAPPER = document.getElementById("week-tiles-bar-wrapper");
        const WEEK_TILES_BAR_STATIC = document.getElementById("week-tiles-bar-static");
        console.log(WEEK_TILES_BAR_WRAPPER);

        function renderWeek(previousOrNext){

            if(weekNumberFromNow < 0){
                weekNumberFromNow = 0;
                previousOrNext = "init";
            }
            console.log(weekNumberFromNow);
            let currentDay = weekNumberFromNow * 7;
            let startingDay = new Date();
            startingDay.setDate(startingDay.getDate() - 3 + weekNumberFromNow * 7);
            
            const WEEK_TO_DISPLAY_DIV = document.createElement("div");
            WEEK_TO_DISPLAY_DIV.classList.add(previousOrNext === "next" ? "to-slide-down" : "to-slide-up");
            WEEK_TILES_BAR_WRAPPER.appendChild(WEEK_TO_DISPLAY_DIV);

            for(let i = 0; i < 7; i++){
                let startingDayName = new Intl.DateTimeFormat("pl-PL", {weekday:"long"}).format(startingDay);
                let startingDayNumber = new Date(startingDay).getDate();
                let startingDayMonth = new Intl.DateTimeFormat("pl-PL", {month:"long"}).format(startingDay);
                let startingDayYear = new Date(startingDay).getFullYear();            

                const DAY_TO_DISPLAY_DIV = document.createElement("div");
                DAY_TO_DISPLAY_DIV.classList.add("tiles");
                DAY_TO_DISPLAY_DIV.classList.add("day");
                DAY_TO_DISPLAY_DIV.classList.add(currentDay == 3 ? "day-current" : null);
                DAY_TO_DISPLAY_DIV.classList.add(currentDay >= 3 ? "day-active" : null);
                DAY_TO_DISPLAY_DIV.setAttribute("date", startingDay.toISOString().split("T")[0]);
                WEEK_TO_DISPLAY_DIV.appendChild(DAY_TO_DISPLAY_DIV);
                
                let dayNameToDisplayDiv = document.createElement("p");
                dayNameToDisplayDiv.classList.add("day");
                dayNameToDisplayDiv.classList.add("day-name");
                dayNameToDisplayDiv.textContent = startingDayName;
                DAY_TO_DISPLAY_DIV.appendChild(dayNameToDisplayDiv);
                
                dayNameToDisplayDiv = document.createElement("p");
                dayNameToDisplayDiv.classList.add("day");
                dayNameToDisplayDiv.classList.add("day-number");
                dayNameToDisplayDiv.textContent = startingDayNumber;
                DAY_TO_DISPLAY_DIV.appendChild(dayNameToDisplayDiv);
                
                dayNameToDisplayDiv = document.createElement("p");
                dayNameToDisplayDiv.classList.add("day");
                dayNameToDisplayDiv.classList.add("day-month");
                dayNameToDisplayDiv.textContent = startingDayMonth;
                DAY_TO_DISPLAY_DIV.appendChild(dayNameToDisplayDiv);
                
                dayNameToDisplayDiv = document.createElement("p");
                dayNameToDisplayDiv.classList.add("day");
                dayNameToDisplayDiv.classList.add("day-year");
                dayNameToDisplayDiv.textContent =startingDayYear;
                DAY_TO_DISPLAY_DIV.appendChild(dayNameToDisplayDiv);
                    
                startingDay.setDate(startingDay.getDate() + 1);
                currentDay++;
            }
            
            if(previousOrNext === "init") WEEK_TO_DISPLAY_DIV.classList.add("sliding-in");
            setTimeout(()=>{
                        WEEK_TO_DISPLAY_DIV.classList.add("sliding-in");
                        
                        setTimeout(() => {WEEK_TILES_BAR_STATIC.innerHTML = WEEK_TO_DISPLAY_DIV.innerHTML;
                                     WEEK_TO_DISPLAY_DIV.remove()}, 500);
            }, 100);
    }

    renderWeek("init");

    document.getElementById("arrowHeadLeft").addEventListener("click", ()=>{
                                                                            --weekNumberFromNow;
                                                                            renderWeek("previous");
                                                                            });
    document.getElementById("arrowHeadRight").addEventListener("click", ()=>{
                                                                            ++weekNumberFromNow;
                                                                           renderWeek("next");
                                                                            });

    </script>
    
</body>
</html>
