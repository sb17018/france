<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #calendar{
            position: relative;
            display: inline-block;
        }
        #week-tiles-bar,  #week-tiles-bar-wrapper{
            min-width: 700px;
            height: 100px;
            position: absolute;
            top: -100px;
            left: 100px;
            display: inline-block;
        }
        #week-tiles-bar-wrapper{
            top: 0;
            overflow: hidden;
        }
        .tiles{
            width: 100px;
            height: 100px;
            margin: 0;
            display: inline-block;
            background-color: rgb(223, 227, 219);
            color: rgb(201, 204, 204);
            text-align: center;
            font-size: 15px;
            font-weight: 600;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            
        }
        #week-tiles-bar{
            height: 200px;
            transition: top .5s;
        }
       #week-tiles-bar.sliding-in{
            top: 0;
        }
        .day-active{
            background-color: rgb(188, 240, 137);
            color: rgb(10, 102, 105);
        }
        .day-current{
            color: rgb(55, 206, 211);
        }
        .arrow-heads{
            display: block;
            background-color: chartreuse;
            color: cadetblue;
        }
        #week-tiles-bar{
            width: auto;
            display: inline-block;
        }
        .day-active:hover, .arrow-heads:hover{
            opacity: .8;
            cursor: pointer;
        }
        .day-active:active, .arrow-heads:active{
            outline: 2px solid red;
            outline-offset: -2px;
        }
        p.day, .arrow-head-char{
            margin: 0;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        p.day-name{
            font-size: 16px;
        }
        p.day-number{
            font-size: 30px;
        }
        p.day-month{
            font-size: 16px;
        }
        p.day-year{
            font-size: 14px;
        }
    </style>
</head>
<body>
    <main>
    <div id="calendar">
        <div id="arrowHeadLeft" class="tiles arrow-heads"><p class="arrow-head-char">&larr;</p></div>
        <div id="week-tiles-bar-wrapper"></div>
        <div id="week-tiles-bar"></div>
        <div id="arrowHeadRight" class="tiles arrow-heads"><p class="arrow-head-char">&rarr;</p></div>
    </div>
    </main>

    <script>
        
        let today = new Date();
        
        let weekNumberFromNow = 0;
        
        const WEEK_TILES_BAR = document.getElementById("week-tiles-bar");
        
        function renderWeek(){
            WEEK_TILES_BAR.classList.remove("sliding-in");
            let weekToDisplay = "";
            let slide = setTimeout(()=>{
                        WEEK_TILES_BAR.classList.add("sliding-in");
                    }, 300);

            if(weekNumberFromNow < 0) weekNumberFromNow = 0;
            console.log(weekNumberFromNow);
            let currentDay = weekNumberFromNow * 7;
            let startingDay = new Date(today);
            startingDay.setDate(startingDay.getDate() - 3 + weekNumberFromNow * 7);
            for(let i = 0; i < 7; i++){
                let startingDayName = new Intl.DateTimeFormat("pl-PL", {weekday:"long"}).format(startingDay);
                let startingDayNumber = new Date(startingDay).getDate();
                let startingDayMonth = new Intl.DateTimeFormat("pl-PL", {month:"long"}).format(startingDay);
                let startingDayYear = new Date(startingDay).getFullYear();            

                    weekToDisplay += '<div class="tiles day' + (currentDay == 3 ? " day-current" : "") + (currentDay >= 3 ? " day-active" : "") +'" data[date]='+ startingDay.toISOString().split("T")[0] +'>' +
                                    '<p class="day day-name">' + startingDayName + '</p>'+
                                    '<p class="day day-number">' + startingDayNumber + '</p>'+
                                    '<p class="day day-month">' + startingDayMonth + '</p>'+
                                    '<p class="day day-year">' + startingDayYear + '</p>'+
                                    '</div>'
                    
                    WEEK_TILES_BAR.innerHTML = weekToDisplay;

                
                startingDay.setDate(startingDay.getDate() + 1);
                currentDay++;
            }   
    }

    renderWeek(0);

    document.getElementById("arrowHeadLeft").addEventListener("click", ()=>{WEEK_TILES_BAR.innerHTML = "";
                                                                            --weekNumberFromNow;
                                                                            renderWeek();
                                                                            });
    document.getElementById("arrowHeadRight").addEventListener("click", ()=>{WEEK_TILES_BAR.innerHTML = "";
                                                                            ++weekNumberFromNow;
                                                                           renderWeek();
                                                                            });

    </script>
    
</body>
</html>
