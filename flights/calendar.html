<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #calendar{
            width: fit-content;
            height: fit-content;
            position: relative;
            display: inline-block;
        }
        #week-tiles-bar,  #week-tiles-bar-wrapper{
            min-width: 700px;
            height: 100px;
            position: absolute;
            top: -100px;
            left: 0;
            display: inline-block;
        }
        #week-tiles-bar-wrapper{
            top: 50px;
            z-index: 999;
            overflow: hidden;
        }
        .tiles{
            width: 100px;
            height: 100px;
            margin: 0;
            display: inline-block;
            background-color: rgb(223, 227, 219);
            color: rgb(201, 204, 204);
            text-align: center;
            font-size: 15px;
            font-weight: 600;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            
        }
        #week-tiles-bar{
            height: 100px;
            transition: top .5s;
        }
        #week-tiles-bar.sliding-in{
            top: 0;
        }
        .day-active{
            background-color: rgb(188, 240, 137);
            color: rgb(10, 102, 105);
        }
        .day-current{
            color: rgb(55, 206, 211);
        }
        .arrow-heads{
            width: 700px;
            height: 50px;
            position: absolute;
            top: 0;
            left: 0;
            display: block;
            background-color: chartreuse;
            color: cadetblue;
        }
        .arrow-heads:last-child{
            top: 150px;
        }
        /* #week-tiles-bar{
            width: auto;
            display: inline-block;
        } */
        .day-active:hover, .arrow-heads:hover{
            opacity: .8;
            cursor: pointer;
        }
        .day-active:active, .arrow-heads:active{
            outline: 2px solid red;
            outline-offset: -2px;
        }
        p.day, .arrow-head-char{
            margin: 0;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        p.day-name{
            font-size: 16px;
        }
        p.day-number{
            font-size: 30px;
        }
        p.day-month{
            font-size: 16px;
        }
        p.day-year{
            font-size: 14px;
        }
    </style>
</head>
<body>
    <main>
    <div id="calendar">
        <div id="arrowHeadLeft" class="tiles arrow-heads"><p class="arrow-head-char">&uArr;<br/>PREVIOUS WEEK</p></div>
            <div id="week-tiles-bar-wrapper">
                <div id="week-tiles-bar-static"></div>
            </div>
        <div id="arrowHeadRight" class="tiles arrow-heads"><p class="arrow-head-char">NEXT WEEK<br/>&dArr;</p></div>
    </div>
    </main>

    <script>
        
        let today = new Date();
        
        let weekNumberFromNow = 0;
        
        const WEEK_TILES_BAR_WRAPPER = document.getElementById("week-tiles-bar-wrapper");
        const WEEK_TILES_BAR_STATIC = document.getElementById("week-tiles-bar-static");
        console.log(WEEK_TILES_BAR_WRAPPER);

        function renderWeek(){
            // let weekToDisplay = '<div id="week-tiles-bar">';
            if(weekNumberFromNow < 0) weekNumberFromNow = 0;
            console.log(weekNumberFromNow);
            let currentDay = weekNumberFromNow * 7;
            let startingDay = new Date(today);
            startingDay.setDate(startingDay.getDate() - 3 + weekNumberFromNow * 7);
            
            const WEEK_TO_DISPLAY_DIV = document.createElement("div");
            WEEK_TO_DISPLAY_DIV.id="week-tiles-bar";
            WEEK_TILES_BAR_WRAPPER.appendChild(WEEK_TO_DISPLAY_DIV);

            for(let i = 0; i < 7; i++){
                let startingDayName = new Intl.DateTimeFormat("pl-PL", {weekday:"long"}).format(startingDay);
                let startingDayNumber = new Date(startingDay).getDate();
                let startingDayMonth = new Intl.DateTimeFormat("pl-PL", {month:"long"}).format(startingDay);
                let startingDayYear = new Date(startingDay).getFullYear();            

                const DAY_TO_DISPLAY_DIV = document.createElement("div");
                DAY_TO_DISPLAY_DIV.classList.add("tiles");
                DAY_TO_DISPLAY_DIV.classList.add("day");
                DAY_TO_DISPLAY_DIV.classList.add(currentDay == 3 ? "day-current" : null);
                DAY_TO_DISPLAY_DIV.classList.add(currentDay >= 3 ? "day-active" : null);
                DAY_TO_DISPLAY_DIV.setAttribute("date", startingDay.toISOString().split("T")[0]);
                WEEK_TO_DISPLAY_DIV.appendChild(DAY_TO_DISPLAY_DIV);
                
                let DAY_NAME_TO_DISPLAY_DIV = document.createElement("p");
                DAY_NAME_TO_DISPLAY_DIV.classList.add("day");
                DAY_NAME_TO_DISPLAY_DIV.classList.add("day-name");
                DAY_NAME_TO_DISPLAY_DIV.textContent = startingDayName;
                DAY_TO_DISPLAY_DIV.appendChild(DAY_NAME_TO_DISPLAY_DIV);
                
                DAY_NAME_TO_DISPLAY_DIV = document.createElement("p");
                DAY_NAME_TO_DISPLAY_DIV.classList.add("day");
                DAY_NAME_TO_DISPLAY_DIV.classList.add("day-number");
                DAY_NAME_TO_DISPLAY_DIV.textContent = startingDayNumber;
                DAY_TO_DISPLAY_DIV.appendChild(DAY_NAME_TO_DISPLAY_DIV);
                
                DAY_NAME_TO_DISPLAY_DIV = document.createElement("p");
                DAY_NAME_TO_DISPLAY_DIV.classList.add("day");
                DAY_NAME_TO_DISPLAY_DIV.classList.add("day-month");
                DAY_NAME_TO_DISPLAY_DIV.textContent = startingDayMonth;
                DAY_TO_DISPLAY_DIV.appendChild(DAY_NAME_TO_DISPLAY_DIV);
                
                DAY_NAME_TO_DISPLAY_DIV = document.createElement("p");
                DAY_NAME_TO_DISPLAY_DIV.classList.add("day");
                DAY_NAME_TO_DISPLAY_DIV.classList.add("day-year");
                DAY_NAME_TO_DISPLAY_DIV.textContent =startingDayYear;
                DAY_TO_DISPLAY_DIV.appendChild(DAY_NAME_TO_DISPLAY_DIV);
                    
                startingDay.setDate(startingDay.getDate() + 1);
                currentDay++;
            }
            setTimeout(()=>{
                        document.getElementById("week-tiles-bar").classList.add("sliding-in");
            }, 300);
            // weekToDisplay += '</div>';
    }

    renderWeek(0);

    document.getElementById("arrowHeadLeft").addEventListener("click", ()=>{WEEK_TILES_BAR_WRAPPER.innerHTML = "";
                                                                            --weekNumberFromNow;
                                                                            renderWeek();
                                                                            });
    document.getElementById("arrowHeadRight").addEventListener("click", ()=>{WEEK_TILES_BAR_WRAPPER.innerHTML = "";
                                                                            ++weekNumberFromNow;
                                                                           renderWeek();
                                                                            });

    </script>
    
</body>
</html>
