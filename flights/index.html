<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #table td, #table th{
            border: 1px solid darkgray;
        }

        #table tr:hover{
            background-color: bisque;
        }
    </style>
</head>
<body>
    <fieldset>
        <legend>Origin to consider:</legend>
        <input type="checkbox" name="origin" id="Dublin" value="DUB" checked><label for="Dublin">Dublin</label><br/>
        <input type="checkbox" name="origin" id="Cork" value="ORK"><label for="Cork">Cork</label><br/>
        <input type="checkbox" name="origin" id="Shannon" value="SNN"><label for="Shannon">Shannon</label><br/>
    </fieldset>
    <fieldset>
        <legend>Destinations to consider:</legend>
        <input type="checkbox" name="destination" id="Biarritz" value="BIQ"><label for="Biarritz">Biarritz</label><br/>
        <input type="checkbox" name="destination" id="Carcassonne" value="CCF"><label for="Carcassonne">Carcassonne</label><br/>
        <input type="checkbox" name="destination" id="Grenoble" value="GNB"><label for="Grenoble">Grenoble</label><br/>
        <input type="checkbox" name="destination" id="La Rochelle" value="LRH"><label for="La Rochelle">La Rochelle</label><br/>
        <input type="checkbox" name="destination" id="Lourdes–Pyrenees" value="LDE"><label for="Lourdes–Pyrenees">Lourdes–Pyrenees</label><br/>
        <input type="checkbox" name="destination" id="Marseille" value="MRS"><label for="Marseille">Marseille</label><br/>
        <input type="checkbox" name="destination" id="Nantes" value="NTE"><label for="Nantes">Nantes</label><br/>
        <input type="checkbox" name="destination" id="Nice" value="NCE"><label for="Nice">Nice</label><br/>
        <input type="checkbox" name="destination" id="Nimes" value="FNI"><label for="Nimes">Nimes</label><br/>
        <input type="checkbox" name="destination" id="Paris Beauvais" value="BVA"  checked><label for="Paris Beauvais">Paris Beauvais</label><br/>
        <input type="checkbox" name="destination" id="Rodez" value="RDZ"><label for="Rodez">Rodez</label><br/>
        <input type="checkbox" name="destination" id="Toulouse" value="TLS"><label for="Toulouse">Toulouse</label><br/>
    </fieldset>
    <label for="departureDay">Departure day:</label>
    <input type="date" name="departureDay" id="departureDay" value="2025-06-30"><br/>

    <label for="toleranceAroundDeptDate">Acceptable departure within</label>
    <select name="toleranceAroundDeptDate" id="toleranceAroundDeptDate">
        <option value=1>1</option>
        <option value=2>2</option>
        <option value=3 selected>3</option>
        <option value=4>4</option>
        <option value=5>5</option>
        <option value=6>6</option>
        <option value=7>7</option>
        <option value="other">other</option>
    </select>
    <label for="toleranceAroundDeptDate">days</label><br/>
    <label for="beforeAfterBoth">Before / After:</label>
    <select name="beforeAfterBoth" id="beforeAfterBoth">
        <option value=-1>Before</option>
        <option value=0>Before and after</option>
        <option value=1 selected>After</option>
    </select><br/>
    <label for="numberOfDaysOfTrip">Stay up to</label>
    <select name="numberOfDaysOfTrip" id="numberOfDaysOfTrip">
        <option value=1>1</option>
        <option value=2>2</option>
        <option value=3 selected>3</option>
        <option value=4>4</option>
        <option value=5>5</option>
        <option value=6>6</option>
        <option value=7>7</option>
        <option value=5>8</option>
        <option value=6>9</option>
        <option value=7>10</option>
        <option value="other">other</option>
    </select>
    <label for="numberOfDaysOfTrip">days</label><br/>
    <input type="button" id="checkBtn" value="Check"><br/>
    <div id="tablePlaceholder"></div>

    <script>

        const TABLE = document.querySelector("#tablePlaceholder");
       
        const ORIGINS = document.querySelectorAll("input[name='origin']");
        const DESTINATIONS = document.querySelectorAll("input[name='destination']");
        const DEPARTURE_DATE_FIELD = document.getElementById("departureDay");
        const DEPT_DAYS_TOLERANCE = document.getElementById("toleranceAroundDeptDate");
        const STAY_DAYS = document.getElementById("numberOfDaysOfTrip");

        const MIN_STAY_TIME = 6;
        
        function chooseDestinationCodes(){
            const chosenDestination = [];
            DESTINATIONS.forEach(dest =>{
                if(dest.checked==true){
                    chosenDestination.push({'destination_code':dest.value, 'destination_name': dest.nextElementSibling.textContent});
                }
            });
            return chosenDestination;
        }

       function chooseOriginCodes(){
            let chosenOrigins = [];
            ORIGINS.forEach(orig =>{
                if(orig.checked==true){
                    chosenOrigins.push({'origin_code':orig.value, 'origin_name': orig.nextElementSibling.textContent});
                }
        });
            return chosenOrigins;
        }

        const CHECK_BTN = document.getElementById("checkBtn");
        
        let data = function getFlightData(){
            const XHTTP = new XMLHttpRequest();
            XHTTP.onload = async function() {
                if(this.responseText){
                    console.log(this.responseText);
                    TABLE.innerHTML = await this.responseText;
                }
            }
            XHTTP.open("GET", "getFlight.php?originCode=" + JSON.stringify(chooseOriginCodes()) + "&destinationCode=" + JSON.stringify(chooseDestinationCodes()) + "&departureDate=" + DEPARTURE_DATE_FIELD.value + "&departureTolerance=" + DEPT_DAYS_TOLERANCE.value + "&maxDaysStay=" + STAY_DAYS.value, true);
            XHTTP.send();
        }

        CHECK_BTN.addEventListener("click", data);

        function activateBooking(departureDateTime, flightOutOriginCode, flightOutDestinationCode, arrivalDateTime, flightInOriginCode, flightInDestinationCode){
    
            window.open("https://www.ryanair.com/ie/en/trip/flights/select?adults=1&teens=0&children=0&infants=0&dateOut=" + departureDateTime + "&dateIn=&isConnectedFlight=false&discount=0&promoCode=&isReturn=false&originIata=" + flightOutOriginCode + "&destinationIata=" + flightOutDestinationCode + "&tpAdults=1&tpTeens=0&tpChildren=0&tpInfants=0&tpStartDate=" + departureDateTime + "&tpEndDate=&tpDiscount=0&tpPromoCode=&tpOriginIata=" + flightOutOriginCode + "&tpDestinationIata=" + flightOutDestinationCode);
            // IFRAME_2.src = "https://www.ryanair.com/ie/en/trip/flights/select?adults=1&teens=0&children=0&infants=0&dateOut=" + arrivalDateTime + "&dateIn=&isConnectedFlight=false&discount=0&promoCode=&isReturn=false&originIata=" + flightInOriginCode + "&destinationIata=" + flightInDestinationCode + "&tpAdults=1&tpTeens=0&tpChildren=0&tpInfants=0&tpStartDate=" + arrivalDateTime + "&tpEndDate=&tpDiscount=0&tpPromoCode=&tpOriginIata=" + flightInOriginCode + "&tpDestinationIata=" + flightInDestinationCode;
        }

       ;

</script>
</body>
</html>
